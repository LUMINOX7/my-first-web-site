<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #10101c;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      padding: 40px 25px;
      background: #1c1c30;
      border: 1px solid #39395c;
      border-radius: 20px;
    }

    h1 {
      font-size: 38px;
      color: #a78bfa;
      margin-bottom: 20px;
    }

    p {
      color: #ccccdd;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    button {
      background: #8055ed;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6035cb;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome!</h1>

    <p>
      This is my first website.
      I created it using AI and GitHub.
    </p>

    <button onclick="showMessage()">
      Click Me
    </button>
  </div>

  <script>
    function showMessage() {
      alert("Congratulations! Your website is working!");
    }
  </script>

</body>
</html>
